# Services that need ENCRYPT_KEY or JWT_SECRET merge this in. It loads the
# values secrets-init generated (see below) before handing off to the image's
# own entrypoint. A value set in .env always wins: the file only fills in
# variables that are empty or unset.
x-with-secrets: &with-secrets
  entrypoint: ["/bin/sh", "-c", 'if [ -r /gainium-secrets/secrets.env ]; then . /gainium-secrets/secrets.env; fi; exec docker-entrypoint.sh "$$@"', "--"]
  volumes:
    - 'gainium-secrets:/gainium-secrets:ro'

services:

  # =============================================================================
  # INFRASTRUCTURE SERVICES
  # =============================================================================

  # Generates this installation's ENCRYPT_KEY and JWT_SECRET on first boot, so
  # a new installation never runs on the build's shared fallback key or the
  # public sample JWT secret.
  #
  # - Only on a NEW installation, i.e. while the mongo volume holds no data
  #   yet. An existing installation is never given a new key: that would
  #   re-encrypt its stored exchange credentials under a key nobody has
  #   backed up. Existing installations keep using .env exactly as before.
  # - The values are kept inside the mongo volume, next to the data they
  #   protect, so the key and the credentials encrypted under it are kept or
  #   lost together. They are copied to the gainium-secrets volume on every
  #   boot for the services to read.
  # - .env wins. Set ENCRYPT_KEY / JWT_SECRET there and the generated values
  #   are ignored.
  #
  # Uses the mongo image so that, on a new installation, the first mount of
  # the mongo volume initialises it exactly as mongo itself would.
  #
  # Back the key up:  ./setupEncryptKey.sh   (copies it into .env)
  # or print it:      docker compose run --rm --no-deps secrets-init show
  secrets-init:
    platform: linux/amd64
    image: 'bitnamilegacy/mongodb:latest'
    user: "0:0"
    restart: 'no'
    environment:
      - ENCRYPT_KEY=${ENCRYPT_KEY}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - 'mongo:/bitnami'
      - 'gainium-secrets:/gainium-secrets'
    entrypoint:
      - /bin/sh
      - -c
      - |
        stored=/bitnami/gainium/secrets.env
        shared=/gainium-secrets/secrets.env

        if [ "$${1:-}" = show ]; then
          # Effective values after .env precedence, for backing up.
          if [ -r "$$stored" ]; then . "$$stored"; fi
          echo "ENCRYPT_KEY=$${ENCRYPT_KEY:-}"
          echo "JWT_SECRET=$${JWT_SECRET:-}"
          exit 0
        fi

        if [ ! -f "$$stored" ]; then
          if [ -e /bitnami/mongodb/data/db/WiredTiger ]; then
            echo "[secrets-init] existing installation: nothing generated, .env stays in charge"
            : > "$$shared" 2>/dev/null || true
            exit 0
          fi
          set -eu
          gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
          mkdir -p /bitnami/gainium
          chmod 700 /bitnami/gainium
          {
            # A value already set in .env is stored as is, so removing it
            # from .env later cannot switch the installation to another key.
            printf ': "$${ENCRYPT_KEY:=%s}"; export ENCRYPT_KEY\n' "$${ENCRYPT_KEY:-$$(gen)}"
            printf ': "$${JWT_SECRET:=%s}"; export JWT_SECRET\n' "$${JWT_SECRET:-$$(gen)}"
          } > "$$stored.tmp"
          chmod 600 "$$stored.tmp"
          mv "$$stored.tmp" "$$stored"
          echo "[secrets-init] new installation: ENCRYPT_KEY and JWT_SECRET stored."
          echo "[secrets-init] Back the key up: ./setupEncryptKey.sh, or docker compose run --rm --no-deps secrets-init show"
        fi

        set -eu
        cp "$$stored" "$$shared.tmp"
        chmod 644 "$$shared.tmp"
        mv "$$shared.tmp" "$$shared"
      - secrets-init

  mongo:
    platform: linux/amd64
    restart: 'unless-stopped'
    image: 'bitnamilegacy/mongodb:latest'
    hostname: localhost
    environment:
      - MONGODB_ROOT_USER=root
      - MONGODB_ROOT_PASSWORD=${MONGO_DB_PASSWORD}
      - MONGODB_USERNAME=${MONGO_DB_USERNAME}
      - MONGODB_PASSWORD=${MONGO_DB_PASSWORD}
      - MONGODB_DATABASE=${MONGO_DB_NAME}
      - MONGODB_PORT_NUMBER=${MONGO_DB_PORT}
    volumes:
      - 'mongo:/bitnami'
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: [
        "CMD-SHELL",
        "mongosh --host localhost --port ${MONGO_DB_PORT} --username ${MONGO_DB_USERNAME} --password ${MONGO_DB_PASSWORD} --authenticationDatabase ${MONGO_DB_NAME} --eval 'db.runCommand({ping: 1})' --quiet || exit 1"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s  # MongoDB first start can take time
  
  redis:
    restart: 'unless-stopped'
